  - Project Memory:
    - Memory Model: concepts/knowledge-base.md
    - Session & Tool Continuity: concepts/continuity.md
    - Search, Capture & Context: cli/search-and-context.md
    - Knowledge Workflows: workflows/knowledge-and-standards.md
    - Attention, Mail & Focus: cli/attention.md
    - Project Mail: cli/mail.md
    - Personal Focus: cli/focus.md
    - Cross-Repo Peering: concepts/cross-repo.md
  - Verified Delivery:
    - Delivery System: concepts/core-loop.md
    - Specs & Lifecycle: concepts/specs.md
    - Agents & Skills: concepts/agents-and-skills.md
    - Discovery & Design: workflows/discovery-and-design.md
    - Delivery & Debugging: workflows/delivery-and-debugging.md
    - Review & Quality: workflows/review-and-quality.md
