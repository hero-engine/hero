site_name: Hero
site_description: Spec-driven AI engineering workflow
site_url: https://docs.heroengine.ai
repo_url: https://github.com/hero-engine/hero
repo_name: hero-engine/hero
docs_dir: src

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Introduction:
    - What Is Hero?: what-is-hero.md
    - Why Hero: why-hero.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Project Setup: getting-started/project-setup.md
    - First Workflow: getting-started/first-workflow.md
  - Concepts:
    - The Core Loop: concepts/core-loop.md
    - Specs & Lifecycle: concepts/specs.md
    - Knowledge Base: concepts/knowledge-base.md
    - Agents & Skills: concepts/agents-and-skills.md
    - Cross-Repo Peering: concepts/cross-repo.md
  - Workflows:
    - Discovery & Design: workflows/discovery-and-design.md
    - Delivery & Debugging: workflows/delivery-and-debugging.md
    - Review & Quality: workflows/review-and-quality.md
    - Sprint & Planning: workflows/sprint-and-planning.md
    - Knowledge & Standards: workflows/knowledge-and-standards.md
  - CLI Reference:
    - Overview: cli/overview.md
    - Spec Management: cli/spec-management.md
    - Search & Context: cli/search-and-context.md
    - Import: cli/import.md
    - Tracker Integration: cli/tracker-integration.md
    - Cross-Repo Peering: cli/peering.md
    - Testing & Demos: cli/testing-and-demos.md
    - Server & MCP: cli/server-and-mcp.md
  - Serve:
    - Homes: serve/homes.md
  - Commands Reference: commands/index.md
  - Agents Reference: agents/index.md
  - Configuration:
    - hero.json: configuration/hero-json.md
    - Tracker Setup: configuration/tracker-setup.md
    - MCP Setup: configuration/mcp-setup.md
  - Project Structure: project-structure.md
  - Releases: releases/index.md
