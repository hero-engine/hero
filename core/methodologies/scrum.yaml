# Scrum methodology profile — sprint-driven, story-points, burndown.
#
# Structural layer: lifecycle states, time-box requirements, estimation
# field, rituals, rollups. Independent of vocabulary (display names).
# Aligned with the agile-scrum vocabulary preset by default.

name: scrum
display_name: "Scrum"
description: "Sprint-driven iterative delivery with story points, daily standup cadence, sprint review and retrospective rituals, and velocity / burndown rollups."

aligned_vocabulary: agile-scrum

lifecycle:
  feature:
    states: [backlog, ready, in_progress, in_review, done]
    transitions:
      - {from: backlog, to: ready, gate: "AC present; estimated"}
      - {from: ready, to: in_progress, gate: "claimed; sprint-committed"}
      - {from: in_progress, to: in_review, gate: "implementation done"}
      - {from: in_review, to: done, gate: "AC passing; review approved"}
  bug:
    states: [reported, diagnosing, fixing, verifying, done]
    transitions:
      - {from: reported, to: diagnosing, gate: "triaged; assigned"}
      - {from: diagnosing, to: fixing, gate: "root cause identified"}
      - {from: fixing, to: verifying, gate: "fix implemented"}
      - {from: verifying, to: done, gate: "regression test passing"}
  sprint:
    states: [planning, active, completed, retrospected]
    transitions:
      - {from: planning, to: active, gate: "sprint goal set; capacity committed"}
      - {from: active, to: completed, gate: "sprint end date reached"}
      - {from: completed, to: retrospected, gate: "retro held"}
  release:
    states: [planning, in_progress, shipped]
    transitions:
      - {from: planning, to: in_progress, gate: "scope locked"}
      - {from: in_progress, to: shipped, gate: "all sprints completed; release notes published"}

time_boxes:
  - level: release
    artifact_type: release
    duration_typical: quarter
    required: false
  - level: iteration
    artifact_type: sprint
    duration_default: 2w
    required: true
    rituals:
      - {kind: planning, when: start}
      - {kind: standup, when: daily}
      - {kind: review, when: end}
      - {kind: retro, when: end}

estimation:
  feature:
    required_field: points
    scale: [1, 2, 3, 5, 8, 13, 21]
  bug:
    required_field: points
    scale: [1, 2, 3, 5, 8, 13, 21]

in_flight_tracking: burndown

cadence:
  daily_standup: true
  weekly_sync: false
  rituals:
    - {kind: planning, when: sprint_start}
    - {kind: standup, when: daily}
    - {kind: review, when: sprint_end}
    - {kind: retro, when: sprint_end}

rollups:
  - {kind: velocity, over: last_3_sprints}
  - {kind: sprint_burndown, scope: current_sprint}
  - {kind: commitment_reliability, over: last_3_sprints}
