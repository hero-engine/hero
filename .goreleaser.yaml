# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hero

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/hero/
    binary: hero
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: hero-engine
      name: homebrew-tap
      token: "{{ .Env.TAP_TOKEN }}"
    url_template: "https://github.com/hero-engine/hero-releases/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://hero-engine.dev"
    description: "Spec-driven AI engineering workflow"
    license: "MIT"
    commit_author:
      name: hero-engine-bot
      email: noreply@hero-engine.dev
    install: |
      bin.install "hero"
    test: |
      system "#{bin}/hero", "--version"

release:
  github:
    owner: hero-engine
    name: hero-releases
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
