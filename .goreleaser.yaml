# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hero

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/hero/
    binary: hero
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: "Major Features"
      regexp: "^feat"
      order: 0
    - title: "Fixes"
      regexp: "^fix"
      order: 1

brews:
  - repository:
      owner: hero-engine
      name: homebrew-tap
      token: "{{ .Env.TAP_TOKEN }}"
    directory: Formula
    url_template: "https://github.com/hero-engine/hero-releases/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://heroengine.ai"
    description: "Persistent project memory and delivery workflows for AI engineering agents"
    license: "Apache-2.0"
    commit_author:
      name: hero-engine-bot
      email: 277887514+chet-bellows@users.noreply.github.com
    install: |
      bin.install "hero"
    test: |
      system "#{bin}/hero", "--version"

scoops:
  - repository:
      owner: hero-engine
      name: scoop-bucket
      token: "{{ .Env.TAP_TOKEN }}"
    directory: bucket
    url_template: "https://github.com/hero-engine/hero-releases/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://heroengine.ai"
    description: "Persistent project memory and delivery workflows for AI engineering agents"
    license: "Apache-2.0"
    commit_author:
      name: hero-engine-bot
      email: 277887514+chet-bellows@users.noreply.github.com

release:
  github:
    owner: hero-engine
    name: hero-releases
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
