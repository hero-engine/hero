# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hero

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/hero/
    binary: hero
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: hero-engine
      name: homebrew-tap
    homepage: "https://github.com/hero-engine/hero"
    description: "Spec-driven AI engineering workflow"
    license: "MIT"
    install: |
      bin.install "hero"
    test: |
      system "#{bin}/hero", "--version"

release:
  github:
    owner: hero-engine
    name: hero
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
