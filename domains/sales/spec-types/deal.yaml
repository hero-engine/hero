# Hero Sales — Deal Spec Type
# This schema defines the frontmatter fields for deal specs.
# Deals are the primary work unit in the Hero Sales domain —
# equivalent to "feature" in engineering.

name: deal
description: An active sales opportunity being worked toward close.
domain: sales

# ─── Required Fields ───────────────────────────────────────────────────────

fields:
  title:
    type: string
    required: true
    description: Human-readable deal name (e.g. "Acme Corp — Enterprise Platform Deal")

  slug:
    type: string
    required: true
    description: URL-safe identifier (e.g. "acme-corp-enterprise")

  type:
    type: enum
    values: [deal, prospect, playbook, battlecard, campaign, retro]
    required: true
    default: deal
    description: |
      - deal      — Active opportunity being worked
      - prospect  — Lead or prospect to research/qualify
      - playbook  — Repeatable sales motion
      - battlecard — Competitive positioning against one competitor
      - campaign  — Multi-deal coordinated effort
      - retro     — Win/loss analysis on a closed deal

  status:
    type: enum
    values: [prospect, qualifying, demo, proposal, negotiation, won, lost]
    required: true
    default: prospect
    description: |
      The current deal stage. Maps to CRM stage:
      - prospect    — In the system, not yet qualified
      - qualifying  — Running MEDDPICC/BANT, assessing fit
      - demo        — Active evaluation, demo completed or scheduled
      - proposal    — Proposal or SOW submitted
      - negotiation — Commercial terms being negotiated
      - won         — Closed Won
      - lost        — Closed Lost

# ─── Deal Identity ──────────────────────────────────────────────────────────

  company:
    type: string
    required: true
    description: Company name (matches CRM account name)

  owner:
    type: string
    required: false
    description: Rep email or username who owns this deal

  arr:
    type: integer
    required: false
    description: Annual Recurring Revenue of this deal in USD (whole number)
    example: 120000

  close_date:
    type: date
    required: false
    format: YYYY-MM-DD
    description: Targeted close date (synced from CRM)

  stage:
    type: string
    required: false
    description: CRM stage label (used for display; status is the canonical field)
    example: "Qualifying"

# ─── Qualification ──────────────────────────────────────────────────────────

  meddpicc_score:
    type: integer
    required: false
    minimum: 0
    maximum: 100
    description: |
      MEDDPICC qualification score (0–100). Computed by /qualify.
      - 0–39  — High risk, major gaps
      - 40–59 — Moderate, some gaps
      - 60–79 — Solid, minor gaps
      - 80–100 — Well-qualified

  probability:
    type: integer
    required: false
    minimum: 0
    maximum: 100
    description: |
      Win probability as a percentage (0–100). Used in weighted forecast.
      Default values by stage:
      - Prospecting: 10
      - Discovery: 20
      - Evaluation: 40
      - Proposal: 60
      - Negotiation: 80
      - Won: 100
      - Lost: 0

  qualification_framework:
    type: string
    required: false
    default: meddpicc
    description: Framework used to qualify this deal (meddpicc, bant, spin, custom)

# ─── CRM Integration ────────────────────────────────────────────────────────

  crm_id:
    type: string
    required: false
    description: CRM opportunity ID (e.g. Salesforce Opportunity ID "006Dn000003abcD")

  crm_type:
    type: enum
    values: [salesforce, hubspot, pipedrive, manual]
    required: false
    description: Which CRM this deal lives in

# ─── Inherited Hero Fields ──────────────────────────────────────────────────

  priority:
    type: enum
    values: [P0, P1, P2, P3]
    required: false
    description: Deal priority (P0 = must close this quarter, P3 = low urgency)

  tags:
    type: list
    items:
      type: string
    required: false
    description: Free-form tags (e.g. ["enterprise", "competitive", "expansion"])

  relations:
    type: list
    required: false
    description: |
      Links to related specs (e.g. parent campaign, related playbook):
        - target: acme-corp-campaign
          kind: part-of
        - target: enterprise-land-playbook
          kind: informed-by

# ─── Example Frontmatter ────────────────────────────────────────────────────

example: |
  ---
  title: Acme Corp — Enterprise Platform Deal
  slug: acme-corp-enterprise
  type: deal
  status: qualifying
  company: Acme Corp
  owner: jane.smith@company.com
  arr: 120000
  close_date: 2026-09-30
  stage: Qualifying
  meddpicc_score: 42
  probability: 25
  qualification_framework: meddpicc
  crm_id: 006Dn000003abcDEFG
  crm_type: salesforce
  priority: P1
  tags: [enterprise, competitive, new-logo]
  relations:
    - target: q3-enterprise-campaign
      kind: part-of
    - target: enterprise-land-playbook
      kind: informed-by
  ---
