name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # PAT with contents:write on hero-engine/hero-releases and
          # hero-engine/homebrew-tap. The default GITHUB_TOKEN is scoped to
          # the private source repo and can't push cross-repo.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}
