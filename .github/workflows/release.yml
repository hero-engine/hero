name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # PAT with contents:write on hero-engine/hero-releases and
          # hero-engine/homebrew-tap. The default GITHUB_TOKEN is scoped to
          # the private source repo and can't push cross-repo.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Trigger docs deploy to refresh the releases page
        # Only fires when docs.yml's own deploy gate is on — a tag push
        # should not force-deploy docs if DEPLOY_DOCS is off (see docs.yml).
        if: vars.DEPLOY_DOCS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs.yml \
            --repo "${{ github.repository }}" \
            --field deploy=true
