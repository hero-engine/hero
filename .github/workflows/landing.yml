name: Deploy Landing

on:
  # Automatic deployment is disabled by default.
  # To enable: set DEPLOY_LANDING=true in repository variables
  # (Settings > Secrets and variables > Actions > Variables)
  # and configure CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.
  push:
    branches: [main]
    paths:
      - "web/landing/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Workers"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
      (github.event_name == 'push' && vars.DEPLOY_LANDING == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/landing
          command: deploy
