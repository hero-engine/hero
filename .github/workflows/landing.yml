name: Build Landing

on:
  pull_request:
    paths:
      - "web/landing/**"
      - "requirements-docs.txt"
      - "internal/cli/docs_check.go"
      - "internal/cli/public_docs_check.go"
      - "internal/cli/public_docs_check_test.go"
      - "internal/serve/mcp_tools_def.go"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "web/landing/**"
      - "requirements-docs.txt"
      - "internal/cli/docs_check.go"
      - "internal/cli/public_docs_check.go"
      - "internal/cli/public_docs_check_test.go"
      - "internal/serve/mcp_tools_def.go"
      - ".github/workflows/landing.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated artifact after the public launch gate"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate public documentation contract
        run: go run ./cmd/hero docs check --public --invocations

      - name: Test landing claims and build tooling
        working-directory: web/landing
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate tracked landing source
        working-directory: web/landing
        run: python scripts/landing_build.py check-source

      - name: Build revision-identifiable landing artifact
        working-directory: web/landing
        run: python scripts/landing_build.py build
        env:
          HERO_LANDING_REVISION: ${{ github.sha }}

      - name: Validate rendered HTML, links, assets, and revision metadata
        working-directory: web/landing
        run: python scripts/landing_build.py check-artifact

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-landing-${{ github.sha }}
          path: web/landing/dist

      - name: Check public links before an approved deployment
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy &&
          vars.LANDING_LAUNCH_APPROVED == 'true'
        working-directory: web/landing
        run: python scripts/landing_build.py check-artifact --external

      - name: Deploy approved artifact to Cloudflare
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy &&
          vars.LANDING_LAUNCH_APPROVED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/landing
          command: deploy

      - name: Verify deployed landing revision and production root
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy &&
          vars.LANDING_LAUNCH_APPROVED == 'true'
        run: go run ./cmd/hero docs check --production landing --expected-revision "${{ github.sha }}"
