name: Deploy Docs

on:
  # Automatic deployment is disabled by default.
  # To enable: set DEPLOY_DOCS=true in repository variables
  # (Settings > Secrets and variables > Actions > Variables)
  push:
    branches: [main]
    paths:
      - "web/docs/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements-docs.txt

      - name: Generate release notes page
        working-directory: web/docs
        run: python scripts/generate_release_notes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        working-directory: web/docs
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.DEPLOY_DOCS == 'true')
        working-directory: web/docs
        run: mkdocs gh-deploy --force
