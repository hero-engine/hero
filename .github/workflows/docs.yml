name: Deploy Docs

on:
  pull_request:
    paths:
      - "web/docs/**"
      - "requirements-docs.txt"
      - "internal/cli/docs_check.go"
      - "internal/cli/public_docs_check.go"
      - "internal/cli/public_docs_check_test.go"
      - "internal/serve/mcp_tools_def.go"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "web/docs/**"
      - "requirements-docs.txt"
      - "internal/cli/docs_check.go"
      - "internal/cli/public_docs_check.go"
      - "internal/cli/public_docs_check_test.go"
      - "internal/serve/mcp_tools_def.go"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated artifact to the Cloudflare Worker"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: pip install -r requirements-docs.txt

      - name: Validate public documentation contract
        run: go run ./cmd/hero docs check --public --invocations

      - name: Test documentation tooling
        working-directory: web/docs
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate release notes page
        working-directory: web/docs
        run: python scripts/generate_release_notes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release and source revision markers
        working-directory: web/docs
        run: python scripts/docs_build.py metadata
        env:
          HERO_DOCS_REVISION: ${{ github.sha }}

      - name: Build docs
        working-directory: web/docs
        run: mkdocs build --strict

      - name: Remove unused reciprocal search bundles
        working-directory: web/docs
        run: python scripts/docs_build.py sanitize

      - name: Check generated JavaScript syntax
        working-directory: web/docs
        run: python scripts/docs_build.py check-js

      - name: Check internal links and anchors
        working-directory: web/docs
        run: python scripts/docs_build.py check

      - name: Check external links before deployment
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.DEPLOY_DOCS == 'true')
        working-directory: web/docs
        run: python scripts/docs_build.py check --external

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-docs-${{ github.sha }}
          path: web/docs/site

      - name: Deploy to Cloudflare Workers
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.DEPLOY_DOCS == 'true')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/docs
          command: deploy

      - name: Verify deployed documentation revision and production paths
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
          (github.event_name == 'push' && vars.DEPLOY_DOCS == 'true')
        run: go run ./cmd/hero docs check --production docs --expected-revision "${{ github.sha }}"
