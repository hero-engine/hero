name: Feature request
description: Propose an outcome for the Hero CLI or public repository
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and desired outcome before prescribing an implementation. Hero Code and Hero Cloud are separate proprietary products and are out of scope here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or easier?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Remove private project information before submitting examples.
  - type: checkboxes
    id: boundary
    attributes:
      label: Repository boundary
      options:
        - label: This request is for the public Hero CLI/repository, not Hero Code or Hero Cloud.
          required: true
