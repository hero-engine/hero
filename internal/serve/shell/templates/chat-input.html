{{- /* chat-input — three variants (hero | overlay | inline).
       Owned conceptually by hero-chat-and-model; shell ships the
       stable template path. Param: shell.ChatInput. */ -}}
{{ define "chat-input" }}
<div class="chat-input {{ .Variant }}" data-chat-input-variant="{{ .Variant }}">
  <span class="chat-input-icon">
    <svg width="20" height="20" viewBox="0 0 90 90" fill="currentColor" aria-hidden="true"><path d="M52 8 L22 46 L40 46 L34 82 L68 42 L50 42 Z"/></svg>
  </span>
  <input class="chat-input-field"
         type="text"
         placeholder="{{ .Placeholder }}"
         data-command-bar-input />
  <button class="chat-input-submit" aria-label="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  {{- if .Context }}
  <div class="chat-context-chips">
    {{- range .Context }}
    <span class="chat-context-chip" data-chip-kind="{{ .Kind }}">{{ .Label }}</span>
    {{- end }}
  </div>
  {{- end }}
</div>
{{ end }}
