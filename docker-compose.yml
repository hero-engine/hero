services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v25.1
    command: start-single-node --insecure --store=cockroach-data
    ports:
      - "26257:26257"   # SQL
      - "8081:8080"     # CockroachDB dashboard
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    image: cockroachdb/cockroach:latest-v25.1
    command: >
      sql --insecure --host=cockroachdb:26257 -e
      "CREATE DATABASE IF NOT EXISTS hero;
       CREATE USER IF NOT EXISTS hero;
       GRANT ALL ON DATABASE hero TO hero;"
    depends_on:
      cockroachdb:
        condition: service_healthy
    restart: "no"

  hero-cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    ports:
      - "8080:8080"
    environment:
      HERO_DB_URL: "postgresql://hero@cockroachdb:26257/hero?sslmode=disable"
    depends_on:
      init-db:
        condition: service_completed_successfully

volumes:
  cockroach-data:
